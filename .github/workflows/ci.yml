name: Build and verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21', '25']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v4
      - name: Build, test and check compatibility
        run: bash ./gradlew build --no-daemon --warning-mode all
      - name: Upload plugin and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wellsell-java-${{ matrix.java }}
          path: |
            build/libs/WellSell-*.jar
            build/reports/
          if-no-files-found: warn
          retention-days: 14
